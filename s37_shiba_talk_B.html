<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="トーク">
<meta name="theme-color" content="#9eadd7">
<link rel="manifest" href='data:application/manifest+json,{"name":"トーク","short_name":"トーク","display":"fullscreen","background_color":"%239eadd7","theme_color":"%239eadd7","start_url":"."}'>
<title>トーク</title>
<style>
  :root{
    --bg:#9eadd7;
    --ink:#1c2131;
    --mine:#cceb95;
    --theirs:#ffffff;
    --meta:#49536c;
    --check:#50886a;
    --label:#7b8ab3;
    --icon:#23262f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(180deg,var(--bg) 0 50%,#fff 50% 100%)}
  body{
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-text-size-adjust:100%;
  }
  .app{
    position:fixed;top:0;bottom:0;left:0;right:0;
    width:100%;max-width:430px;margin:0 auto;
    display:flex;flex-direction:column;
    background:
      radial-gradient(ellipse 62% 13% at 0% 40%, rgba(255,255,255,.27), rgba(255,255,255,0) 100%),
      radial-gradient(ellipse 48% 9% at 8% 45%, rgba(255,255,255,.12), rgba(255,255,255,0) 100%),
      radial-gradient(ellipse 66% 12% at 0% 79%, rgba(255,255,255,.27), rgba(255,255,255,0) 100%),
      radial-gradient(ellipse 80% 14% at 18% 88%, rgba(255,255,255,.10), rgba(255,255,255,0) 100%),
      linear-gradient(180deg, rgba(255,255,255,0) 45%, rgba(255,255,255,.05) 100%),
      var(--bg);
    overflow:hidden;
  }

  /* iPhoneのホーム画面から開いたとき、画面の高さがステータスバー分だけ短く扱われるのを補正 */
  .ios-sa .app{bottom:calc(0px - env(safe-area-inset-top))}

  /* ---------- 上部 ---------- */
  .top{flex:none;padding-top:env(safe-area-inset-top)}
  .statusbar{
    display:none;height:26px;padding:0 22px;
    align-items:center;justify-content:space-between;
    font-size:15px;font-weight:600;letter-spacing:.02em;
  }
  .statusbar.on{display:flex}
  .sb-r{display:flex;align-items:center;gap:6px}
  .gap12{height:12px}
  .header{
    height:52px;display:flex;align-items:center;
    padding:0 12px 0 8px;gap:12px;
  }
  .back{
    flex:none;width:28px;height:28px;border-radius:50%;
    background:rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;
  }
  .name{
    flex:1;min-width:0;
    font-size:18px;font-weight:700;text-align:left;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;
  }
  .hicons{flex:none;display:flex;align-items:center;gap:18px}
  .hicons svg{display:block}

  /* ---------- トーク ---------- */
  .talk{
    flex:1;min-height:0;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:4px 13px 18px 7px;
    scrollbar-width:none;
  }
  .talk::-webkit-scrollbar{display:none}
  .center{display:flex;justify-content:center;margin:18px 0 0}
  .center + .center{margin-top:14px}
  .label{
    background:var(--label);color:#fff;
    font-size:12px;line-height:25px;height:25px;
    padding:0 12px;border-radius:13px;letter-spacing:.01em;
  }
  .label.wide{height:27px;line-height:27px;padding:0 15px}

  .row{display:flex;margin-top:16px}
  .center + .row{margin-top:16px}
  .row.theirs{justify-content:flex-start;align-items:flex-start}
  .row.mine{justify-content:flex-end}

  .av{
    flex:none;width:36px;height:36px;border-radius:50%;
    overflow:hidden;margin-right:13px;background:#cfd6e6;
  }
  .av img{width:100%;height:100%;object-fit:cover;display:block}

  .bwrap{display:flex;align-items:flex-end;gap:6px}
  .row.theirs .bwrap{max-width:calc(100% - 49px - 34px)}
  .row.mine .bwrap{max-width:calc(100% - 40px)}

  .bubble{
    position:relative;
    padding:10px 14px 11px;
    font-size:15.5px;line-height:1.46;letter-spacing:.02em;
    white-space:pre-wrap;word-break:break-word;
    border-radius:22px;
    filter:drop-shadow(0 .5px .6px rgba(40,50,90,.08));
  }
  .row.theirs .bubble{background:var(--theirs);border-top-left-radius:18px}
  .row.mine .bubble{background:var(--mine);border-top-right-radius:18px}
  .tail{position:absolute;top:0;width:12px;height:16px;pointer-events:none}
  .row.theirs .tail{left:-6px}
  .row.mine .tail{right:-6px;transform:scaleX(-1)}
  .row.theirs .tail path{fill:var(--theirs)}
  .row.mine .tail path{fill:var(--mine)}

  .meta{
    flex:none;display:flex;flex-direction:column;
    font-size:11px;line-height:1.2;color:var(--meta);
    padding-bottom:2px;letter-spacing:.02em;
  }
  .row.mine .meta{align-items:center}
  .meta svg{display:block;margin:0 auto 2px}

  /* ---------- 入力欄 ---------- */
  .footer{
    flex:none;background:#fff;
    padding:9px 12px calc(16px + env(safe-area-inset-bottom)) 14px;
  }
  .bar{display:flex;align-items:center;gap:14px}
  .bar > svg{flex:none;display:block}
  .input{
    flex:1;min-width:0;height:38px;border-radius:12px;
    background:#f3f4f6;border:1px solid #e6e8ec;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 10px 0 15px;margin:0 2px;
    font-size:15px;color:#a8acb6;letter-spacing:.04em;
  }
  .input svg{flex:none;display:block}
</style>
</head>

  ]},
  {label:"9日前", items:[
    {who:"m", time:"18:21", text:"明日ってお休みですか？☺️"},
    {who:"t", time:"18:27", text:"はい！\n特に予定ないです😊"},

  ]},

const TAIL = '<svg class="tail" viewBox="0 0 12 16"><path d="M12 15.5H6.6C6 12.4 4.6 8.6 2.1 5 1.3 3.8 2.1 2.4 3.5 2.8 6 3.6 8.6 4.6 12 5z"/></svg>';
const CHECKS = '<svg width="21" height="11" viewBox="-1.3 -1.3 21 11"><g fill="none" stroke="var(--check)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M.5 3.6 4 8 10.6.6"/><path d="M8.3 3.4 11.5 8 18.2.6"/></g></svg>';

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  let h = "";
  TALK.forEach(day=>{
    h += '<div class="center"><span class="label">'+day.label+'</span></div>';
    day.items.forEach(it=>{
      if(it.who==="unsend"){
        h += '<div class="center"><span class="label wide">メッセージの送信を取り消しました</span></div>';
        return;
      }
      if(it.who==="t"){
        h += '<div class="row theirs">'
          + '<div class="av"><img src="'+AVATAR_SRC+'" alt=""></div>'
          + '<div class="bwrap"><div class="bubble">'+esc(it.text)+TAIL+'</div>'
          + '<div class="meta"><span>'+it.time+'</span></div></div></div>';
      }else{
        h += '<div class="row mine"><div class="bwrap">'
          + '<div class="meta">'+CHECKS+'<span>'+it.time+'</span></div>'
          + '<div class="bubble">'+esc(it.text)+TAIL+'</div></div></div>';
      }
    });
  });
  document.getElementById("talk").innerHTML = h;
}

function toBottom(){const t=document.getElementById("talk"); t.scrollTop=t.scrollHeight;}

function tick(){
  const d=new Date();
  document.getElementById("sbtime").textContent = d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
}

render();
tick(); setInterval(tick, 10000);
document.getElementById("name").addEventListener("click", ()=>{
  document.getElementById("statusbar").classList.toggle("on");
  toBottom();
});
toBottom();
window.addEventListener("load", toBottom);
window.addEventListener("resize", toBottom);
setTimeout(toBottom, 300);

/* ページ全体のスクロール・ピンチを抑止（トーク部分のみスクロール可） */
document.addEventListener("touchmove", e=>{
  if(!e.target.closest("#talk")) e.preventDefault();
},{passive:false});
document.addEventListener("gesturestart", e=>e.preventDefault());
